apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  namespace: argocd-rollouts-demo

resources:
  - ../../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
